<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portale Ciclismo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <style>
        body { font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; }
        .map-container { height: 300px; width: 100%; border-radius: 16px; margin-top: 10px; overflow: hidden; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #f97316; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .card-anim { animation: fadeInUp 0.4s ease both; }
        .btn-friendly { transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .btn-friendly:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .btn-friendly:active { transform: translateY(0) scale(0.98); }
    </style>
</head>
<body class="bg-orange-50 text-gray-800 font-sans">

    <!-- Header & Login -->
    <nav class="bg-gradient-to-r from-orange-500 to-rose-500 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex justify-between items-center flex-wrap gap-2">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold">🚴 Pedale Allegro</h1>
                <p class="text-xs md:text-sm text-orange-100">La community che pedala insieme! 🤝💨</p>
            </div>
            <div id="auth-area" class="flex items-center gap-3"></div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <!-- Benvenuto -->
        <div class="mt-4 mb-2 bg-white rounded-2xl shadow p-5 card-anim">
            <h2 class="text-lg font-bold text-orange-600">Ciao, benvenuto/a! 👋</h2>
            <p class="text-sm text-gray-600 mt-1">Qui trovi tutte le uscite settimanali e le gare in programma. Scegli una scheda qui sotto e... buona pedalata! 🚴‍♀️✨</p>
        </div>

        <!-- Area Messaggi -->
        <div id="msg" class="mb-4 p-3 rounded-xl hidden"></div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-6 mt-4">
            <button onclick="switchTab('uscite')" id="tab-uscite" class="btn-friendly px-5 py-2 rounded-full font-bold bg-white shadow text-orange-600">🗺️ Uscite Settimanali</button>
            <button onclick="switchTab('gare')" id="tab-gare" class="btn-friendly px-5 py-2 rounded-full font-bold text-gray-500 hover:text-orange-600">🏁 Gare</button>
            <div id="admin-btns" class="ml-auto hidden flex items-center gap-2"></div>
        </div>

        <!-- Contenuto -->
        <div id="content-area"></div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-sm text-gray-500">
        Fatto con ❤️ e tanta fatica in salita — <span class="font-semibold">Pedale Allegro</span> 🚴
    </footer>

    <!-- Modale Admin (Nascosto di default) -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-3xl shadow-xl w-full max-w-md card-anim">
            <h3 id="modal-title" class="text-xl font-extrabold mb-4 text-orange-600"></h3>
            <form id="admin-form" class="space-y-4">
                <input type="hidden" id="form-type">
                <input type="text" id="f-titolo" placeholder="✨ Titolo" required class="w-full p-3 border-2 border-orange-100 rounded-xl focus:border-orange-400 focus:outline-none">
                <input type="date" id="f-data" required class="w-full p-3 border-2 border-orange-100 rounded-xl focus:border-orange-400 focus:outline-none">
                <input type="text" id="f-extra" placeholder="Descrizione o Luogo" class="w-full p-3 border-2 border-orange-100 rounded-xl focus:border-orange-400 focus:outline-none">
                <div id="gpx-input-area" class="hidden">
                    <label class="block text-sm font-semibold mb-1">📍 Traccia GPX (opzionale):</label>
                    <input type="file" id="f-gpx" accept=".gpx" class="w-full p-2 border-2 border-dashed border-orange-200 rounded-xl">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="btn-friendly bg-orange-500 text-white px-5 py-2 rounded-full font-bold hover:bg-orange-600">💾 Salva</button>
                    <button type="button" onclick="closeModal()" class="btn-friendly bg-gray-100 text-gray-600 px-5 py-2 rounded-full font-bold hover:bg-gray-200">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- CONFIGURAZIONE: INSERISCI QUI I TUOI DATI DI SUPABASE ---
        const SUPABASE_URL = 'https://wrcvolbhjpzyraooldmt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_WLlo4psCEw3dkah1HTOQhw_Gxpu4A_-';
        // -------------------------------------------------------------

        // URL del tuo sito: serve per i link di conferma email di Supabase.
        // Metti qui l'indirizzo esatto da cui apri il portale (es. https://iltuosito.vercel.app)
        // e aggiungilo anche in Supabase → Authentication → URL Configuration → Redirect URLs.
        const SITE_URL = window.location.origin + window.location.pathname;

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: {
                flowType: 'implicit',                    // login classico con token nell'URL: compatibile con i link di conferma/recovery
                detectSessionInUrl: true,                // cattura il token dal link e crea la sessione automaticamente
                redirectTo: SITE_URL                     // dopo la conferma torna qui (deve essere tra i Redirect URLs in Supabase)
            }
        });
        let currentUser = null;
        let isAdmin = false;
        let profileMissing = false; // true se la tabella profiles non ha una riga per l'utente loggato
        let signUpPendingUser = null; // utente appena registrato in attesa di conferma email

        // Gestione UI e Messaggi
        const showMsg = (text, type = 'success') => {
            const msg = document.getElementById('msg');
            msg.textContent = (type === 'success' ? '🎉 ' : '😅 ') + text;
            msg.className = `mb-4 p-3 rounded-xl font-semibold card-anim ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 4000);
        };

        // --- AUTENTICAZIONE ---
        async function checkUser() {
            // 0) Pulizia/recupero da token presenti nell'URL (link di conferma, errori vecchi, ecc.)
            await salvageSessionFromUrl();

            // 1) Se nel link è presente un token/code di conferma email, completiamo qui lo scambio.
            if (window.location.hash.includes('access_token') || window.location.search.includes('code=')) {
                try {
                    const { data, error } = await sb.sessionFromUrl(window.location.href);
                    if (error) console.warn('sessionFromUrl:', error.message);
                    else if (data.session) showMsg('Email confermata! Benvenuto/a nella community 🎉');
                    else showMsg('Link di conferma elaborato, ora puoi accedere. ✅');
                } catch (e) { console.warn(e); }
                // puliamo l'URL dal token, così ricaricando non dà errori
                history.replaceState(null, '', window.location.pathname + window.location.search);
            }

            // 2) Recovery password: se il link conteneva type=recovery, impostiamo subito una nuova password
            if (window.location.hash.includes('type=recovery')) {
                const nuova = prompt('Password recuperata! Scegli una nuova password (almeno 6 caratteri):');
                if (nuova && nuova.length >= 6) {
                    const { error } = await sb.auth.updateUser({ password: nuova });
                    if (error) showMsg(error.message, 'error');
                    else showMsg('Password aggiornata! Ora sei dentro. 🔓');
                }
            }

            // 3) Ricarichiamo la sessione e aggiorniamo la UI
            const { data: { session } } = await sb.auth.getSession();
            currentUser = session?.user ?? null;
            renderAuthUI();
            if (currentUser) await checkRole();
            loadData();
        }

        // Recupera la sessione ANCHE da un hash deprecato (es. ?error_code=...#access_token=...)
        // e pulisce l'URL: evita che un token vecchio blocchi il login successivo ("not logged in").
        function salvageSessionFromUrl() {
            return new Promise((resolve) => {
                try {
                    const h = window.location.hash || '';
                    if (h.includes('access_token') && !h.includes('error')) {
                        const p = new URLSearchParams(h.slice(1));
                        const at = p.get('access_token'), rt = p.get('refresh_token');
                        if (at) {
                            const user = JSON.parse(localStorage.getItem('sb-wrcvolbhjpzyraooldmt-auth-token') || 'null');
                            if (user?.currentSession?.access_token === at) { resolve(true); return; } // già salvata dal client
                            sb.auth.setSession({ access_token: at, refresh_token: rt }).then(() => resolve(true));
                            history.replaceState(null, '', window.location.pathname + window.location.search);
                            return;
                        }
                    }
                    if (window.location.search.includes('error=')) {
                        history.replaceState(null, '', window.location.pathname); // rimuove errori vecchi dall'URL
                    }
                } catch (e) { console.warn(e); }
                resolve(false);
            });
        }

        async function checkRole() {
            profileMissing = false;
            const { data, error } = await sb.from('profiles').select('is_admin').eq('id', currentUser.id).maybeSingle();
            if (error) {
                console.warn('Errore lettura profilo:', error.message);
                showMsg('Attenzione: errore leggendo il tuo profilo (' + error.message + ').', 'error');
            } else if (!data) {
                // L'utente esiste in Auth ma non ha la riga in profiles (trigger mancante o utente creato prima dello script SQL):
                // la creiamo al volo, altrimenti non potrà mai diventare admin / iscriversi.
                profileMissing = true;
                const { error: insErr } = await sb.from('profiles').insert({ id: currentUser.id, nome: currentUser.user_metadata?.nome || 'Atleta', is_admin: false });
                if (insErr) {
                    console.warn('Auto-creazione profilo fallita:', insErr.message);
                    showMsg('Il tuo profilo non è ancora completo: chiedi a un admin di crearlo (tabella "profiles").', 'error');
                } else {
                    profileMissing = false;
                    showMsg('Profilo creato! Ora sei dei nostri. 🚴');
                }
            }
            isAdmin = data?.is_admin || false;
            renderAuthUI();
        }

        function renderAuthUI() {
            const area = document.getElementById('auth-area');
            const adminBtns = document.getElementById('admin-btns');
            if (!currentUser) {
                // Se l'utente si è appena registrato ma deve confermare l'email: avvisalo con chiarezza
                const pendingUser = signUpPendingUser;
                area.innerHTML = `<button onclick="login()" class="btn-friendly bg-white text-orange-600 px-4 py-1.5 rounded-full font-bold shadow">🔑 Accedi</button>`;
                adminBtns.classList.add('hidden');
                if (pendingUser) {
                    const box = document.getElementById('confirm-box');
                    if (!box) {
                        const div = document.createElement('div');
                        div.id = 'confirm-box';
                        div.className = 'mb-4 p-4 rounded-xl bg-sky-100 text-sky-900 text-sm font-semibold card-anim';
                        div.innerHTML = '📬 <b>Ultimo passo!</b> Account creato per <b>' + (pendingUser.email || '') + '</b>.<br>' +
                            'Controlla la tua casella di posta e clicca il link di conferma che ti ha inviato Supabase, poi ricarica la pagina e accedi. 🚴';
                        document.querySelector('main').prepend(div);
                    }
                }
            } else {
                area.innerHTML = `<span class="text-sm md:text-base font-semibold">Ciao ${currentUser.user_metadata?.nome || 'Atleta'}! 👋</span> <button onclick="logout()" class="btn-friendly bg-white/20 px-3 py-1 rounded-full text-sm hover:bg-white/30">Esci</button>`;
                if (isAdmin) {
                    adminBtns.innerHTML = `
                        <button onclick="openModal('uscita')" class="btn-friendly bg-emerald-500 text-white px-3 py-1.5 rounded-full text-sm font-bold shadow">➕ Uscita</button>
                        <button onclick="openModal('gara')" class="btn-friendly bg-violet-500 text-white px-3 py-1.5 rounded-full text-sm font-bold shadow">➕ Gara</button>
                    `;
                    adminBtns.classList.remove('hidden');
                } else {
                    adminBtns.classList.add('hidden');
                    // Spieghiamo SUBITO perché non vede i pulsanti admin, così non sembra "non succeda nulla"
                    const hint = document.getElementById('admin-hint');
                    if (!hint) {
                        const div = document.createElement('div');
                        div.id = 'admin-hint';
                        div.className = 'mb-4 p-4 rounded-xl bg-amber-100 text-amber-900 text-sm font-semibold card-anim';
                        div.innerHTML = '✅ Sei loggato, tutto regolare! Ma al tuo account <b>' + (currentUser.email || '') +
                            '</b> non risulta il ruolo <b>admin</b>, quindi non vedi i pulsanti ➕ Uscita / ➕ Gara.<br>' +
                            'Per ottenerlo: dashboard Supabase → <b>SQL Editor</b> ed esegui:<br>' +
                            '<code class="bg-white px-2 py-1 rounded text-xs block mt-1 break-all">update public.profiles set is_admin = true where id = \'' + currentUser.id + '\';</code>' +
                            'Poi ricarica questa pagina e vedrai i pulsanti per aggiungere contenuti. 🚀';
                        document.querySelector('main').prepend(div);
                    }
                }
            }
            if (currentUser && !profileMissing) {
                const h = document.getElementById('admin-hint');
                if (h && isAdmin) h.remove();
            }
        }

        async function login() {
            // Se c'è già una sessione valida, non serve reinserire le credenziali:
            // (capitava di ritrovarsi "non loggati" per colpa di un token vecchio nell'URL)
            const { data: { session } } = await sb.auth.getSession();
            if (session?.user) {
                currentUser = session.user;
                renderAuthUI();
                await checkRole();
                loadData();
                showMsg('Bentornato/a! La tua sessione era ancora attiva. 😊');
                return;
            }

            const nome = prompt("Il tuo nome (solo la prima volta):");
            const email = prompt("La tua email:");
            const password = prompt("Password (almeno 6 caratteri):");
            if (!email || !password) return;

            // Prima prova a registrare l'utente (se già esiste, Supabase lo dice e facciamo login)
            const { data: signUpData, error: regError } = await sb.auth.signUp({
                email, password,
                options: { data: { nome: nome || 'Utente' }, emailRedirectTo: SITE_URL }
            });

            if (regError) {
                const msg = (regError.message || '').toLowerCase();
                if (msg.includes('already registered') || msg.includes('already exists') || msg.includes('confirmed')) {
                    // L'utente esiste già: normale login
                    const { error } = await sb.auth.signInWithPassword({ email, password });
                    if (error) showMsg(error.message, 'error');
                    else await checkUser();
                } else {
                    showMsg(regError.message, 'error');
                }
                return;
            }

            if (signUpData.session) {
                // Registrazione completata e sessione attiva (conferma email disabilitata)
                showMsg("Evviva! Account creato, benvenuto/a nella community! 🚴");
                await checkUser();
            } else {
                // Serve confermare l'email: proviamo comunque il login (forse è già confermata)
                const { error } = await sb.auth.signInWithPassword({ email, password });
                if (error) {
                    const em = (error.message || '').toLowerCase();
                    if (em.includes('confirm')) {
                        signUpPendingUser = { email };
                        showMsg("Registrato! Controlla la tua email per confermare l'account, poi riprova ad accedere. 📬", 'error');
                    } else if (em.includes('invalid login')) {
                        showMsg("Email o password non corretti: riprova. 🔁", 'error');
                    } else {
                        showMsg(error.message, 'error');
                    }
                    renderAuthUI();
                } else await checkUser();
            }
        }

        // --- DIAGNOSTICA: segnala in alto eventuali errori Supabase (es. tabelle mancanti) ---
        async function checkSchema() {
            const problems = [];
            for (const t of ['uscite', 'gare', 'profiles']) {
                const { error } = await sb.from(t).select('*').limit(1);
                if (error && (error.code === '42P01' || error.code === 'PGRST205')) problems.push(t);
            }
            if (problems.length) {
                const box = document.createElement('div');
                box.className = 'mb-4 p-4 rounded-xl bg-yellow-100 text-yellow-900 text-sm font-semibold card-anim';
                box.innerHTML = '⚠️ Nel database Supabase mancano ancora le tabelle: <b>' + problems.join(', ') + '</b>.<br>' +
                    'Apri la dashboard Supabase → <b>SQL Editor</b> ed esegui lo script di creazione (setup.sql del progetto), poi ricarica questa pagina.';
                document.querySelector('main').prepend(box);
            }
        }

        async function logout() {
            await sb.auth.signOut();
            isAdmin = false;
            currentUser = null;
            location.reload();
        }

        // --- CARICAMENTO DATI ---
        function switchTab(tab) {
            const active = 'btn-friendly px-5 py-2 rounded-full font-bold bg-white shadow text-orange-600';
            const inactive = 'btn-friendly px-5 py-2 rounded-full font-bold text-gray-500 hover:text-orange-600';
            document.getElementById('tab-uscite').className = tab === 'uscite' ? active : inactive;
            document.getElementById('tab-gare').className = tab === 'gare' ? active : inactive;
            loadData(tab);
        }

        async function loadData(tab = 'uscite') {
            const area = document.getElementById('content-area');
            area.innerHTML = '<div class="text-center p-4"><div class="loader"></div> <span class="text-sm text-gray-500">Caricamento, un attimo... ⏳</span></div>';

            if (tab === 'uscite') {
                const { data } = await sb.from('uscite').select('*').order('data_uscita', { ascending: false });
                area.innerHTML = '<div class="space-y-4" id="list-uscite"></div>';
                if (data && data.length > 0) data.forEach(renderUscita);
                else area.innerHTML = '<div class="bg-white rounded-2xl shadow p-8 text-center card-anim"><p class="text-4xl mb-2">🚴‍♂️💨</p><p class="text-gray-500 font-semibold">Ancora nessuna uscita programmata!</p><p class="text-sm text-gray-400 mt-1">Ritorna presto a trovarci, ne vedremo delle belle. 😉</p></div>';
            } else {
                const { data } = await sb.from('gare').select('*, iscrizioni(user_id, profiles(nome))').order('data_gara', { ascending: false });
                area.innerHTML = '<div class="space-y-4" id="list-gare"></div>';
                if (data && data.length > 0) data.forEach(renderGara);
                else area.innerHTML = '<div class="bg-white rounded-2xl shadow p-8 text-center card-anim"><p class="text-4xl mb-2">🏁😴</p><p class="text-gray-500 font-semibold">Nessuna gara in programma al momento.</p><p class="text-sm text-gray-400 mt-1">Ma non temere: ci stiamo allenando per te! 💪</p></div>';
            }
        }

        // --- RENDERING ---
        function renderUscita(item) {
            const div = document.createElement('div');
            div.className = "bg-white p-5 rounded-2xl shadow border-l-4 border-orange-400 card-anim";
            div.innerHTML = `
                <h3 class="font-extrabold text-lg text-gray-800">🚴 ${item.titolo}</h3>
                <p class="text-sm text-gray-500 mt-1">📅 ${item.data_uscita} ${item.descrizione ? '| ' + item.descrizione : ''}</p>
                <div id="map-${item.id}" class="map-container"></div>
            `;
            document.getElementById('list-uscite').appendChild(div);
            
            // Mappa GPX
            if (item.gpx_url) {
                setTimeout(() => {
                    const map = L.map(`map-${item.id}`).setView([45.5, 9.2], 10); // Default su Italia
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
                    new L.GPX(item.gpx_url, { async: true }).on('loaded', function(e) {
                        map.fitBounds(e.target.getBounds());
                    }).addTo(map);
                }, 100);
            } else {
                document.getElementById(`map-${item.id}`).innerHTML = '<div class="flex items-center justify-center h-full bg-orange-50 text-gray-400 text-sm font-semibold"><span>🗺️ La traccia arriverà presto, stay tuned!</span></div>';
            }
        }

        async function renderGara(item) {
            const iscritti = item.iscrizioni || [];
            const isIscritto = currentUser && iscritti.some(i => i.user_id === currentUser.id);
            
            const div = document.createElement('div');
            div.className = "bg-white p-5 rounded-2xl shadow border-l-4 border-violet-400 card-anim";
            div.innerHTML = `
                <div class="flex justify-between items-start gap-2">
                    <div>
                        <h3 class="font-extrabold text-lg text-gray-800">🏁 ${item.titolo}</h3>
                        <p class="text-sm text-gray-500 mt-1">📅 ${item.data_gara} | 📍 ${item.luogo || 'Da definire'}</p>
                    </div>
                    ${currentUser && !isAdmin ? (
                        isIscritto 
                        ? `<button onclick="disiscriviti(${item.id})" class="btn-friendly bg-red-50 text-red-500 px-4 py-1.5 rounded-full text-sm font-bold border border-red-200">😞 Ritiro</button>`
                        : `<button onclick="iscriviti(${item.id})" class="btn-friendly bg-violet-500 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow">💪 Partecipa!</button>`
                    ) : ''}
                </div>
                <div class="mt-4">
                    <h4 class="font-bold text-sm mb-2 text-gray-600">Chi partecipa? (${iscritti.length}) 🎟️</h4>
                    <div class="flex flex-wrap gap-2">
                        ${iscritti.length > 0 ? iscritti.map(i => `<span class="bg-violet-50 text-violet-700 px-3 py-1 rounded-full text-sm font-semibold">😊 ${i.profiles?.nome || 'Anonimo'}</span>`).join('') : '<span class="text-sm text-gray-400">Sii il primo a iscriverti, ti aspettiamo! ✨</span>'}
                    </div>
                </div>
            `;
            document.getElementById('list-gare').appendChild(div);
        }

        // --- AZIONI UTENTE ---
        async function iscriviti(garaId) {
            const { error } = await sb.from('iscrizioni').insert({ user_id: currentUser.id, gara_id: garaId });
            if (error) showMsg("Ops! Qualcosa è andato storto con l'iscrizione.", 'error');
            else { showMsg("Evviva! Iscrizione confermata, ci vediamo lì! 🙌"); loadData('gare'); }
        }

        async function disiscriviti(garaId) {
            const { error } = await sb.from('iscrizioni').delete().eq('user_id', currentUser.id).eq('gara_id', garaId);
            if (error) showMsg("Ops! Non siamo riusciti ad annullare l'iscrizione.", 'error');
            else { showMsg("Iscrizione annullata. Ti aspettiamo alla prossima! 👋"); loadData('gare'); }
        }

        // --- ADMIN MODALE & UPLOAD ---
        function openModal(type) {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('modal-title').textContent = type === 'uscita' ? 'Nuova Uscita' : 'Nuova Gara';
            document.getElementById('form-type').value = type;
            document.getElementById('gpx-input-area').className = type === 'uscita' ? '' : 'hidden';
            document.getElementById('f-extra').placeholder = type === 'uscita' ? 'Descrizione percorso' : 'Luogo della gara';
        }

        function closeModal() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-form').reset();
        }

        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('form-type').value;
            const titolo = document.getElementById('f-titolo').value;
            const data = document.getElementById('f-data').value;
            const extra = document.getElementById('f-extra').value;
            const gpxFile = document.getElementById('f-gpx').files[0];

            let gpxUrl = null;

            if (type === 'uscita' && gpxFile) {
                const filePath = `${currentUser.id}-${Date.now()}.gpx`;
                const { error: uploadErr } = await sb.storage.from('tracce-gpx').upload(filePath, gpxFile);
                if (uploadErr) { showMsg("Errore upload GPX", 'error'); return; }
                const { data: urlData } = sb.storage.from('tracce-gpx').getPublicUrl(filePath);
                gpxUrl = urlData.publicUrl;
            }

            if (type === 'uscita') {
                const { error } = await sb.from('uscite').insert({ titolo, data_uscita: data, descrizione: extra, gpx_url: gpxUrl });
                if (error) { console.error('insert uscite:', error); showMsg("Ops! Non siamo riusciti a salvare l'uscita (" + error.message + ").", 'error'); return; }
                showMsg("Uscita pubblicata! Buona pedalata! 🚴💨");
            } else {
                const { error } = await sb.from('gare').insert({ titolo, data_gara: data, luogo: extra });
                if (error) { console.error('insert gare:', error); showMsg("Ops! Non siamo riusciti a salvare la gara (" + error.message + ").", 'error'); return; }
                showMsg("Gara pubblicata! Che vinca il migliore! 🏆");
            }
            
            closeModal();
            loadData(type === 'uscita' ? 'uscite' : 'gare');
        });

        // AVVIO
        checkUser();
        checkSchema();
    </script>
</body>
</html>
