<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedale Allegro — Community Ciclistica</title>
<meta name="description" content="Uscite settimanali, gare, classifica e bacheca della community Pedale Allegro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --ink:#0e1a2b; --muted:#5b6b80; --line:#e3e9f2;
  --brand:#0d9488; --brand-dark:#0f766e; --brand-soft:#ccfbf1;
  --accent:#f97316; --accent-soft:#ffedd5;
  --violet:#7c3aed; --violet-soft:#ede9fe;
  --rose:#e11d48; --rose-soft:#ffe4e6;
  --sky:#0284c7; --sky-soft:#e0f2fe;
  --shadow:0 1px 2px rgba(14,26,43,.05),0 8px 24px -12px rgba(14,26,43,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Sora','Inter',sans-serif;margin:0;line-height:1.25}
p{margin:0}
a{color:var(--brand-dark)}
.container{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- TOPBAR ---------- */
.topbar{background:linear-gradient(120deg,#0b3b36 0%,#0f766e 55%,#115e59 100%);color:#fff;position:sticky;top:0;z-index:60;box-shadow:0 2px 16px rgba(11,59,54,.35)}
.topbar-inner{display:flex;align-items:center;gap:16px;padding:12px 20px;max-width:1120px;margin:0 auto;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo-mark{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;border:1px solid rgba(255,255,255,.2)}
.logo-name{font-family:'Sora';font-weight:800;font-size:18px;letter-spacing:.2px}
.logo-tag{font-size:11px;color:#99f6e4;font-weight:500}
.nav-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{border:0;background:transparent;color:#cbeee8;font:inherit;font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.18s}
.nav-tab:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-tab.active{background:#fff;color:#0f766e;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.nav-badge{background:var(--accent);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:1px 7px}
.auth-area{display:flex;align-items:center;gap:8px}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:11px;padding:9px 16px;transition:transform .15s,box-shadow .15s,background .15s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(14,26,43,.15)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-ghost:hover{background:rgba(255,255,255,.25)}
.btn-light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--rose-soft);color:#9f1239}
.btn-danger-solid{background:var(--rose);color:#fff}
.btn-violet{background:var(--violet);color:#fff}
.btn-sky{background:var(--sky);color:#fff}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn-xs{padding:4px 10px;font-size:11.5px;border-radius:8px}
.btn-lg{padding:12px 24px;font-size:16px;border-radius:14px}

/* ---------- LAYOUT ---------- */
main{padding:26px 0 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-title{font-size:24px;font-weight:800}
.page-sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.grid{display:grid;gap:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}
.search .icon{position:absolute;left:12px;top:9px;opacity:.5}
.select{padding:10px 12px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff;color:var(--ink)}

/* ---------- CARDS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.card-hover{transition:transform .18s, box-shadow .18s}
.card-hover:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(14,26,43,.05),0 16px 32px -12px rgba(14,26,43,.18)}
.event-card{display:grid;grid-template-columns:86px 1fr;gap:16px;align-items:start}
.date-chip{background:linear-gradient(160deg,var(--brand-soft),#f0fdfa);border:1px solid #99f6e4;border-radius:14px;text-align:center;padding:10px 6px}
.date-chip .d{font-family:'Sora';font-weight:800;font-size:24px;color:var(--brand-dark);line-height:1}
.date-chip .m{font-size:11px;font-weight:700;color:#0d9488;text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.date-chip .w{font-size:10.5px;color:#6b948d;margin-top:2px}
.date-chip.past{background:#f1f5f9;border-color:#e2e8f0}
.date-chip.past .d{color:#94a3b8}.date-chip.past .m{color:#94a3b8}
.ev-title{font-family:'Sora';font-weight:700;font-size:16.5px}
.ev-meta{color:var(--muted);font-size:13px;margin-top:3px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3.5px 10px;border-radius:99px}
.b-orange{background:var(--accent-soft);color:#9a3412}
.b-green{background:#dcfce7;color:#166534}
.b-teal{background:var(--brand-soft);color:#115e59}
.b-violet{background:var(--violet-soft);color:#5b21b6}
.b-sky{background:var(--sky-soft);color:#075985}
.b-rose{background:var(--rose-soft);color:#9f1239}
.b-gray{background:#f1f5f9;color:#475569}
.b-red{background:#fee2e2;color:#991b1b}
.tag-past{filter:grayscale(.4);opacity:.75}
.diff{font-size:11.5px;font-weight:700;padding:3.5px 10px;border-radius:99px}
.d-turista{background:#dcfce7;color:#166534}.d-cicloturista{background:#e0f2fe;color:#075985}
.d-mediofondo{background:#fef9c3;color:#854d0e}.d-fondo{background:#ffedd5;color:#9a3412}.d-granfondo{background:#ffe4e6;color:#9f1239}
.map-container{height:280px;width:100%;border-radius:12px;margin-top:12px;overflow:hidden;border:1px solid var(--line);z-index:0}
.map-placeholder{height:120px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;margin-top:12px}

/* ---------- STATS ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.stat .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.stat .num{font-family:'Sora';font-weight:800;font-size:20px;line-height:1.1}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- ROSTER / TABLE ---------- */
.roster{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rider{display:inline-flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.data tr:last-child td{border-bottom:0}
.medal{font-size:16px}

/* ---------- FORMS ---------- */
.field{display:block;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);transition:border .15s, box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.field textarea{resize:vertical;min-height:80px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}

/* ---------- MODALS ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,26,43,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;box-shadow:0 24px 64px -16px rgba(14,26,43,.4);width:100%;max-width:460px;max-height:92vh;overflow-y:auto;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 0}
.modal-title{font-size:18px;font-weight:800}
.modal-body{padding:16px 22px 22px}
.x-btn{border:0;background:#f1f5f9;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--muted)}
.x-btn:hover{background:#e2e8f0}

/* ---------- MISC ---------- */
#toast-root{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#0e1a2b;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 12px 32px rgba(14,26,43,.35);animation:slideIn .25s ease;display:flex;gap:8px;align-items:center;max-width:340px}
.toast.err{background:#9f1239}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:8px}
.loader{width:22px;height:22px;border:3px solid #d7e3df;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{text-align:center;padding:40px;color:var(--muted)}
footer.site{background:#0b3b36;color:#9fcfc6;padding:26px 0;font-size:13px;margin-top:20px}
footer.site a{color:#5eead4}
.section-title{font-family:'Sora';font-weight:800;font-size:17px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.admin-only{display:none}
body.is-admin .admin-only{display:inline-flex}
.notice{border-radius:12px;padding:12px 16px;font-size:13px;font-weight:600;margin-bottom:14px}
.n-warn{background:#fef9c3;color:#713f12;border:1px solid #fde68a}
.n-info{background:var(--sky-soft);color:#075985;border:1px solid #bae6fd}
.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{padding:9px 4px;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.list-plain li:last-child{border-bottom:0}
.kbd{background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;font-family:monospace}
.chip-toggle{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip-toggle.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media(max-width:760px){
  .nav-tabs{order:3;width:100%}
  .event-card{grid-template-columns:64px 1fr}
  .page-title{font-size:20px}
}
</style>
</head>
<body>

<!-- ============ TOPBAR ============ -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="#" onclick="switchTab('home');return false;">
      <span class="logo-mark">🚴</span>
      <span><span class="logo-name">Pedale Allegro</span><br><span class="logo-tag">Community ciclistica · dal 2020</span></span>
    </a>
    <nav class="nav-tabs" id="nav-tabs">
      <button class="nav-tab active" data-tab="home" onclick="switchTab('home')">🏠 Home</button>
      <button class="nav-tab" data-tab="uscite" onclick="switchTab('uscite')">🗺️ Uscite</button>
      <button class="nav-tab" data-tab="gare" onclick="switchTab('gare')">🏁 Gare <span class="nav-badge" id="gare-badge" style="display:none"></span></button>
      <button class="nav-tab" data-tab="bacheca" onclick="switchTab('bacheca')">💬 Bacheca</button>
      <button class="nav-tab" data-tab="classifica" onclick="switchTab('classifica')">🏆 Classifica</button>
      <button class="nav-tab" data-tab="gruppo" onclick="switchTab('gruppo')">👥 Il Gruppo</button>
      <button class="nav-tab admin-only" data-tab="admin" onclick="switchTab('admin')">🛡️ Admin <span class="nav-badge" style="background:#e11d48">riservato</span></button>
    </nav>
    <div class="auth-area" id="auth-area">
      <button class="btn btn-ghost btn-sm" onclick="openAuthModal('login')">Accedi</button>
      <button class="btn btn-accent btn-sm" onclick="openAuthModal('register')">Registrati</button>
    </div>
  </div>
</header>

<main class="container">
  <div id="notice-area"></div>
  <div id="content-area"><div class="loading-box"><span class="loader"></span>&nbsp; Caricamento…</div></div>
</main>

<footer class="site">
  <div class="container" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <span>© <span id="year"></span> Pedale Allegro — Fatto con ❤️ e tanto fiato in salita.</span>
    <span>Info & iscrizioni: <a href="mailto:info@pedaleallegro.it">info@pedaleallegro.it</a></span>
  </div>
</footer>

<div id="toast-root"></div>

<!-- ============ MODALE AUTH ============ -->
<div class="overlay" id="auth-modal">
  <div class="modal">
    <div class="modal-head"><h3 class="modal-title" id="auth-title">Accedi</h3><button class="x-btn" onclick="closeAuthModal()">✕</button></div>
    <div class="modal-body">
      <p class="page-sub" id="auth-sub" style="margin:-6px 0 16px"></p>
      <form id="auth-form">
        <input type="hidden" id="auth-mode" value="login">
        <div class="field" id="nome-field"><label>Nome</label><input id="a-nome" placeholder="Come ti chiamano in gruppo?" autocomplete="name"></div>
        <div class="field"><label>Email</label><input id="a-email" type="email" placeholder="tu@email.it" autocomplete="email" required></div>
        <div class="field"><label>Password</label><input id="a-password" type="password" placeholder="Minimo 6 caratteri" autocomplete="current-password" minlength="6" required></div>
        <p id="auth-error" class="notice n-warn" style="display:none"></p>
        <button class="btn btn-primary btn-lg" style="width:100%" id="auth-submit-btn" type="submit">Accedi</button>
        <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:14px">
          <span id="auth-switch-label"></span>
          <a href="#" id="auth-switch-btn" onclick="toggleAuthMode();return false;" style="font-weight:700"></a>
        </p>
      </form>
    </div>
  </div>
</div>

<!-- ============ MODALE EVENTO (uscita/gara) ============ -->
<div class="overlay" id="event-modal">
  <div class="modal" style="max-width:540px">
    <div class="modal-head"><h3 class="modal-title" id="ev-modal-title">Nuovo evento</h3><button class="x-btn" onclick="closeEventModal()">✕</button></div>
    <div class="modal-body">
      <form id="event-form">
        <input type="hidden" id="form-type"><input type="hidden" id="form-id">
        <div class="field"><label>Titolo *</label><input id="f-titolo" placeholder="es. Girello del mercoledì" required></div>
        <div class="form-row">
          <div class="field"><label>Data *</label><input id="f-data" type="date" required></div>
          <div class="field"><label>Orario ritrovo</label><input id="f-ora" type="time" value="07:30"></div>
        </div>
        <div class="form-row">
          <div class="field"><label id="lbl-extra">Luogo di partenza</label><input id="f-extra" placeholder="es. Piazza Grande"></div>
          <div class="field"><label>Ritmo / difficoltà</label>
            <select id="f-ritmo">
              <option value="">— non specificato —</option>
              <option>T+ Turista</option><option>T- Turista</option><option>C+ Cicloturista</option><option>C- Cicloturista</option>
              <option>M+ Mediofondo</option><option>M- Mediofondo</option><option>F Fondo</option><option>GF Granfondo</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Distanza (km)</label><input id="f-distanza" type="number" step="0.1" min="0" placeholder="45.5"></div>
          <div class="field"><label>Dislivello (m)</label><input id="f-dislivello" type="number" min="0" placeholder="650"></div>
        </div>
        <div class="field"><label>Descrizione / note</label><textarea id="f-desc" placeholder="Percorso, soste bar, sconsigliato se…"></textarea></div>
        <div class="field" id="gpx-field" style="display:none">
          <label>Traccia GPX</label>
          <input id="f-gpx" type="file" accept=".gpx" style="padding:8px;border-style:dashed">
          <p class="hint" id="gpx-stats" style="display:none;color:var(--brand-dark);font-weight:700"></p>
        </div>
        <div id="ev-error"></div>
        <div style="display:flex;gap:10px;margin-top:6px">
          <button type="submit" class="btn btn-primary" style="flex:1">💾 Salva evento</button>
          <button type="button" class="btn btn-light" onclick="closeEventModal()">Annulla</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ============ MODALE PROFILO ============ -->
<div class="overlay" id="profile-modal">
  <div class="modal">
    <div class="modal-head"><h3 class="modal-title">Il mio profilo</h3><button class="x-btn" onclick="closeProfileModal()">✕</button></div>
    <div class="modal-body">
      <form id="profile-form">
        <div class="field"><label>Nome visualizzato</label><input id="p-nome" placeholder="Il tuo nome in gruppo"></div>
        <div class="field"><label>Bike tag (facoltativo)</label><input id="p-bike" placeholder="es. Pinarello Dogma · Groupy 🚵"></div>
        <p class="hint" style="margin-bottom:14px">Email: <b id="p-email"></b> · <span id="p-role"></span></p>
        <div style="display:flex;gap:10px">
          <button type="submit" class="btn btn-primary" style="flex:1">💾 Salva</button>
          <button type="button" class="btn btn-danger" onclick="logout()">Esci</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// ================= CONFIG SUPABASE =================
const SUPABASE_URL = 'https://wrcvolbhjpzyraooldmt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WLlo4psCEw3dkah1HTOQhw_Gxpu4A_-';
const SITE_URL = window.location.origin + window.location.pathname;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { flowType: 'implicit', detectSessionInUrl: true, redirectTo: SITE_URL }
});

let currentUser = null, isAdmin = false, profileMissing = false, signUpPendingUser = null;
let myProfile = null;
let cacheUscite = [], cacheGare = [], cacheProfili = [], cacheMessaggi = [];
let currentTab = 'home';
const MESES = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const GIORNI = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

// ================= UTIL =================
const $ = id => document.getElementById(id);
function escHTML(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fmtLong(iso){ if(!iso) return ''; const dt=new Date(iso+'T12:00:00'); return GIORNI[dt.getDay()]+' '+dt.getDate()+' '+MESES[dt.getMonth()]+' '+String(dt.getFullYear()).slice(2); }
function avatarColor(name){ let h=0; for(const c of String(name||'?')) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 55% 42%)`; }
function initials(n){ return String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function toast(text, err=false){
  const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=text;
  $('toast-root').appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},3400);
}
function notice(html, cls='n-info'){ $('notice-area').innerHTML = html?`<div class="notice ${cls}">${html}</div>`:''; }
function diffClass(r){ if(!r) return ''; const k=r[0]; return {'T':'d-turista','C':'d-cicloturista','M':'d-mediofondo','F':'d-fondo','G':'d-granfondo'}[k]||'d-cicloturista'; }
function loadingBox(msg){ return `<div class="loading-box"><span class="loader"></span>&nbsp; ${msg||'Caricamento…'}</div>`; }
function emptyBox(icon,title,sub){ return `<div class="empty"><div class="big">${icon}</div><b>${title}</b><div style="font-size:13px;margin-top:4px">${sub||''}</div></div>`; }
function km(v){ return v==null?'':Number(v).toLocaleString('it-IT')+' km'; }
function mt(v){ return v==null?'':Number(v).toLocaleString('it-IT')+' m D+'; }
function isFuture(iso){ return iso && iso >= todayISO(); }

// ================= AUTENTICAZIONE =================
async function checkUser(){
  await salvageSessionFromUrl();
  if (window.location.hash.includes('access_token') || window.location.search.includes('code=')){
    try{
      const {data,error}=await sb.sessionFromUrl(window.location.href);
      if(error) console.warn('sessionFromUrl:',error.message);
      else if(data.session) toast('Email confermata! Benvenuto/a 🎉');
    }catch(e){console.warn(e)}
    history.replaceState(null,'',window.location.pathname+window.location.search);
  }
  if (window.location.hash.includes('type=recovery')){
    const nuova=prompt('Password recuperata! Scegli una nuova password (almeno 6 caratteri):');
    if(nuova&&nuova.length>=6){ const {error}=await sb.auth.updateUser({password:nuova}); error?toast(error.message,true):toast('Password aggiornata 🔓'); }
  }
  const {data:{session}}=await sb.auth.getSession();
  currentUser=session?.user??null;
  renderAuthUI();
  if(currentUser) await checkRole();
  loadData(currentTab);
}

function salvageSessionFromUrl(){
  return new Promise(resolve=>{
    try{
      const h=window.location.hash||'';
      if(h.includes('access_token')&&!h.includes('error')){
        const p=new URLSearchParams(h.slice(1)); const at=p.get('access_token'),rt=p.get('refresh_token');
        if(at){
          const user=JSON.parse(localStorage.getItem('sb-wrcvolbhjpzyraooldmt-auth-token')||'null');
          if(user?.currentSession?.access_token===at){resolve(true);return}
          sb.auth.setSession({access_token:at,refresh_token:rt}).then(()=>resolve(true));
          history.replaceState(null,'',window.location.pathname+window.location.search); return;
        }
      }
      if(window.location.search.includes('error=')) history.replaceState(null,'',window.location.pathname);
    }catch(e){console.warn(e)}
    resolve(false);
  });
}

async function checkRole(){
  profileMissing=false;
  const {data,error}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  if(error){ console.warn('profilo:',error.message); }
  else if(!data){
    profileMissing=true;
    const {error:insErr}=await sb.from('profiles').insert({id:currentUser.id,nome:currentUser.user_metadata?.nome||'Atleta',is_admin:false});
    if(insErr) toast('Profilo non ancora creato: contatta un admin.',true);
    else{ profileMissing=false; toast('Profilo creato! Ora sei dei nostri 🚴'); }
  }else{ myProfile=data; }
  if(profileMissing){ const {data:f}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle(); if(f) myProfile=f; }
  isAdmin=myProfile?.is_admin||false;
  document.body.classList.toggle('is-admin',isAdmin);
  renderAuthUI();
}

function renderAuthUI(){
  const area=$('auth-area');
  if(!currentUser){
    area.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="openAuthModal('login')">Accedi</button>
      <button class="btn btn-accent btn-sm" onclick="openAuthModal('register')">Registrati</button>`;
    if(signUpPendingUser) notice(`📬 <b>Ultimo passo!</b> Account creato per <b>${escHTML(signUpPendingUser.email)}</b>: apri il link di conferma nella tua email, poi ricarica la pagina ed accedi.`);
    else notice();

    const nome=myProfile?.nome||currentUser.user_metadata?.nome||'Atleta';
    area.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="openProfileModal()" title="Il mio profilo">
        <span class="avatar" style="width:22px;height:22px;font-size:9.5px;background:${avatarColor(nome)}">${initials(nome)}</span> Ciao ${escHTML(nome)}</button>
      <button class="btn btn-ghost btn-sm" onclick="logout()" title="Esci">⎋</button>`;

}

function openAuthModal(mode){
  $('auth-modal').classList.add('open');
  $('a-nome').value=localStorage.getItem('pa_nome')||'';
  $('a-email').value=''; $('a-password').value=''; hideAuthError();
  setAuthMode(mode); setTimeout(()=>$('a-email').focus(),60);
}
function closeAuthModal(){ $('auth-modal').classList.remove('open'); }
function toggleAuthMode(){ setAuthMode($('auth-mode').value==='login'?'register':'login'); }
function setAuthMode(mode){
  $('auth-mode').value=mode;
  const login=mode==='login';
  $('auth-title').textContent=login?'🔑 Bentornato/a':'📝 Unisciti al gruppo';
  $('auth-sub').textContent=login?'Accedi per iscriverti alle uscite e gestire il tuo profilo.':'Bastano 30 secondi. Ti serve solo un\'email valida.';
  $('auth-submit-btn').textContent=login?'Accedi':'Crea il mio account';
  $('nome-field').style.display=login?'none':'block';
  $('a-nome').required=!login;
  $('auth-switch-label').textContent=login?'Non hai un account?':'Hai già un account?';
  $('auth-switch-btn').textContent=login?'Registrati':'Accedi';
}
$('auth-modal').addEventListener('click',e=>{if(e.target.id==='auth-modal')closeAuthModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'))});
function showAuthError(t){ const el=$('auth-error'); el.textContent='😅 '+t; el.style.display='block'; }
function hideAuthError(){ $('auth-error').style.display='none'; }

$('auth-form').addEventListener('submit',async e=>{
  e.preventDefault(); hideAuthError();
  const mode=$('auth-mode').value, email=$('a-email').value.trim(), pw=$('a-password').value;
  const btn=$('auth-submit-btn'); btn.disabled=true;
  try{ mode==='login'?await doLogin(email,pw):await doRegister(email,pw); } finally{ btn.disabled=false; }
});
async function doLogin(email,password){
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(!error){ closeAuthModal(); await checkUser(); toast('Benvenuto/a di nuovo! 🚴'); return; }
  const m=(error.message||'').toLowerCase();
  if(m.includes('invalid')||m.includes('not found')) showAuthError('Email o password non corretti, oppure l\'account non esiste. Prova a registrarti!');
  else if(m.includes('confirm')){ signUpPendingUser={email}; showAuthError('Devi ancora confermare l\'email: apri il link ricevuto, poi riprova.'); }
  else showAuthError(error.message);
}
async function doRegister(email,password){
  const nome=$('a-nome').value.trim()||'Utente';
  const {data:res,error:regError}=await sb.auth.signUp({email,password,options:{data:{nome},emailRedirectTo:SITE_URL}});
  if(regError){
    const m=(regError.message||'').toLowerCase();
    if(m.includes('rate limit')) showAuthError('Supabase ha temporaneamente limitato le email di conferma. Riprova tra poco, o disattiva "Confirm email" nella dashboard Supabase → Authentication.');
    else if(m.includes('already')) showAuthError('Questo account esiste già: passa ad Accedi.');
    else showAuthError(regError.message);
    return;
  }
  localStorage.setItem('pa_nome',nome);
  if(res?.session){ closeAuthModal(); toast('Evviva! Account creato 🚴'); await checkUser(); }
  else{ signUpPendingUser={email}; closeAuthModal(); toast('Registrato! Conferma l\'email che ti abbiamo inviato 📬'); renderAuthUI(); }
}

  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));

  const area=$('content-area');
  area.innerHTML=loadingBox();
  try{
    if(tab==='home') await renderHome();
    else if(tab==='uscite') await renderUscite();
    else if(tab==='gare') await renderGare();
    else if(tab==='bacheca') await renderBacheca();
    else if(tab==='classifica') await renderClassifica();
    else if(tab==='gruppo') await renderGruppo();
    else if(tab==='admin') await renderAdmin();

function statCard(ico,bg,num,lbl){ return `<div class="stat"><div class="ico" style="background:${bg}">${ico}</div><div><div class="num">${num}</div><div class="lbl">${lbl}</div></div></div>`; }
function dateChip(iso){
  if(!iso) return '<div class="date-chip past"><div class="d">?</div><div class="m">—</div></div>';
  const [,m,d]=iso.split('-'); const dt=new Date(iso+'T12:00:00');
  return `<div class="date-chip ${isFuture(iso)?'':'past'}"><div class="d">${d}</div><div class="m">${MESES[+m-1]}</div><div class="w">${GIORNI[dt.getDay()]}</div></div>`;
}
function evBadges(e){
  const b=[];
  if(e.ritmo) b.push(`<span class="diff ${diffClass(e.ritmo)}">${escHTML(e.ritmo)}</span>`);
  if(e.distanza_km!=null) b.push(`<span class="badge b-orange">📏 ${km(e.distanza_km)}</span>`);
  if(e.dislivello_m!=null) b.push(`<span class="badge b-green">⛰️ ${mt(e.dislivello_m)}</span>`);
  if(e.ora_ritrovo) b.push(`<span class="badge b-sky">⏰ ${escHTML(e.ora_ritrovo)}</span>`);
  if(e.tipo==='gara'||e.data_gara) b.push(`<span class="badge b-violet">🎟️ ${(e.iscrizioni||[]).length} iscritti</span>`);
  return b.join('');
}
function isIscritto(g){ return currentUser&&(g.iscrizioni||[]).some(i=>i.user_id===currentUser.id); }
function miniEvent(e){
  return `<div class="card card-hover event-card ${isFuture(e.data_uscita)?'':'tag-past'}" style="padding:14px">
    ${dateChip(e.data_uscita)}
    <div style="min-width:0">

function relTime(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<3600) return Math.max(1,Math.round(s/60))+' min fa';
  if(s<86400) return Math.round(s/3600)+' h fa';
  if(s<604800) return Math.round(s/86400)+' g fa';
  return fmtDate(iso.slice(0,10));
}

function initMap(elId,gpxUrl){

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
    new L.GPX(gpxUrl,{async:true,color:'#0d9488',weight:4}).on('loaded',e=>map.fitBounds(e.target.getBounds())).addTo(map);
  },80);
}

// --- GPX parsing ---
function haversine(a,b,c,d){ const R=6371000,r=x=>x*Math.PI/180,dLa=r(c-a),dLo=r(d-b);
  const x=Math.sin(dLa/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function parseGpxPoints(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('File GPX non valido.');
  const pts=[]; doc.getElementsByTagName('*').forEach(n=>{ const t=n.tagName.toLowerCase();
    if(t==='trkpt'||t==='rtept'||t==='wpt'){ const lat=parseFloat(n.getAttribute('lat')),lon=parseFloat(n.getAttribute('lon'));
      if(!isNaN(lat)&&!isNaN(lon)){ let ele=null; for(const c of n.children) if(c.tagName.toLowerCase()==='ele'){const v=parseFloat(c.textContent); if(!isNaN(v))ele=v;}
        pts.push({lat,lon,ele}); }}});
  if(pts.length<2) throw new Error('Il GPX non contiene abbastanza punti.');
  return pts;
}
function calcGpxStats(pts){ let dist=0,gain=0;
  for(let i=1;i<pts.length;i++){ dist+=haversine(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon);
    const p=pts[i-1].ele,c=pts[i].ele; if(p!=null&&c!=null&&c-p>0.5) gain+=c-p; }
  return {distanceM:dist,elevationGainM:gain}; }
$('f-gpx').addEventListener('change',async e=>{
  const file=e.target.files[0]; $('gpx-stats').style.display='none'; if(!file) return;
  try{ const pts=parseGpxPoints(await file.text()); const st=calcGpxStats(pts);
    $('f-distanza').value=(st.distanceM/1000).toFixed(1);
    const hasEle=pts.some(p=>p.ele!=null); if(hasEle) $('f-dislivello').value=Math.round(st.elevationGainM);
    const el=$('gpx-stats'); el.textContent=`🤖 GPX letto: 📏 ${(st.distanceM/1000).toFixed(1)} km${hasEle?' · ⛰️ '+Math.round(st.elevationGainM)+' m D+':''}`; el.style.display='block';
  }catch(err){ toast('GPX illeggibile: '+err.message,true); }
});

$('event-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const type=$('form-type').value, editId=$('form-id').value;
  const payloadBase={ titolo:$('f-titolo').value.trim(), ora_ritrovo:$('f-ora').value||null, ritmo:$('f-ritmo').value||null,
    distanza_km:parseFloat($('f-distanza').value)||null, dislivello_m:parseInt($('f-dislivello').value,10)||null, descrizione:$('f-desc').value.trim()||null };
  let gpxUrl=null;
  const gpxFile=$('f-gpx').files[0];
  if(type==='uscita'&&gpxFile){
    const fp=`${currentUser.id}-${Date.now()}.gpx`;
    const {error:ue}=await sb.storage.from('tracce-gpx').upload(fp,gpxFile);
    if(ue){ toast('Upload GPX fallito: '+ue.message,true); return; }
    gpxUrl=sb.storage.from('tracce-gpx').getPublicUrl(fp).data.publicUrl;
  } else if(type==='uscita'&&editId){ gpxUrl=(cacheUscite.find(x=>String(x.id)===String(editId))||{}).gpx_url||null; }
  let payload,table;
  if(type==='uscita'){ table='uscite'; payload={...payloadBase,data_uscita:$('f-data').value,luogo_partenza:$('f-extra').value||null,gpx_url:gpxUrl}; }
  else{ table='gare'; payload={...payloadBase,data_gara:$('f-data').value,luogo:$('f-extra').value||null}; }
  const q=editId?sb.from(table).update(payload).eq('id',editId):sb.from(table).insert(payload);
  const {error}=await q;
  if(error){ toast('Salvataggio fallito: '+error.message,true); return; }
  closeEventModal(); toast(editId?'Modifiche salvate ✅':'Evento pubblicato 🎉'); loadData(currentTab);
});

// ================= PROFILO =================
function openProfileModal(){
  if(!currentUser) return;
  $('profile-modal').classList.add('open');
  $('p-nome').value=myProfile?.nome||''; $('p-bike').value=myProfile?.bike_tag||'';
  $('p-email').textContent=currentUser.email||'';
  $('p-role').innerHTML=myProfile?.is_admin?'Ruolo: <span class="badge b-rose">👑 Amministratore</span>':'Ruolo: <span class="badge b-teal">Membro</span>';
}
function closeProfileModal(){ $('profile-modal').classList.remove('open'); }
$('profile-modal').addEventListener('click',e=>{if(e.target.id==='profile-modal')closeProfileModal()});
$('profile-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const nome=$('p-nome').value.trim()||'Atleta', bike=$('p-bike').value.trim()||null;
  const {error}=await sb.from('profiles').update({nome,bike_tag:bike}).eq('id',currentUser.id);
  if(error){ toast('Salvataggio fallito: '+error.message,true); return; }
  localStorage.setItem('pa_nome',nome); myProfile={...myProfile,nome,bike_tag:bike};
  closeProfileModal(); toast('Profilo aggiornato ✨'); renderAuthUI();
});

// ================= AVVIO =================
$('year').textContent=new Date().getFullYear();
checkUser(); checkSchema();
</script>
