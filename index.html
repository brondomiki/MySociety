<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portale Ciclismo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <style>
        .map-container { height: 300px; width: 100%; border-radius: 8px; margin-top: 10px; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header & Login -->
    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🚴 Società Ciclistica</h1>
        <div id="auth-area" class="flex items-center gap-4"></div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <!-- Area Messaggi -->
        <div id="msg" class="mb-4 p-3 rounded hidden"></div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-300 mb-6">
            <button onclick="switchTab('uscite')" id="tab-uscite" class="px-4 py-2 font-semibold text-blue-600 border-b-2 border-blue-600">Uscite Settimanali</button>
            <button onclick="switchTab('gare')" id="tab-gare" class="px-4 py-2 font-semibold text-gray-500 hover:text-blue-600">Gare</button>
            <div id="admin-btns" class="ml-auto hidden"></div>
        </div>

        <!-- Contenuto -->
        <div id="content-area"></div>
    </main>

    <!-- Modale Admin (Nascosto di default) -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
            <h3 id="modal-title" class="text-xl font-bold mb-4"></h3>
            <form id="admin-form" class="space-y-4">
                <input type="hidden" id="form-type">
                <input type="text" id="f-titolo" placeholder="Titolo" required class="w-full p-2 border rounded">
                <input type="date" id="f-data" required class="w-full p-2 border rounded">
                <input type="text" id="f-extra" placeholder="Descrizione o Luogo" class="w-full p-2 border rounded">
                <div id="gpx-input-area" class="hidden">
                    <label class="block text-sm font-medium mb-1">Traccia GPX:</label>
                    <input type="file" id="f-gpx" accept=".gpx" class="w-full p-2 border rounded">
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Salva</button>
                    <button type="button" onclick="closeModal()" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- CONFIGURAZIONE: INSERISCI QUI I TUOI DATI DI SUPABASE ---
        const SUPABASE_URL = 'https://wrcvolbhjpzyraooldmt.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_WLlo4psCEw3dkah1HTOQhw_Gxpu4A_-';
        // -------------------------------------------------------------

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;
        let isAdmin = false;

        // Gestione UI e Messaggi
        const showMsg = (text, type = 'success') => {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = `mb-4 p-3 rounded ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 4000);
        };

        // --- AUTENTICAZIONE ---
        async function checkUser() {
            const { data: { session } } = await sb.auth.getSession();
            currentUser = session?.user;
            renderAuthUI();
            if (currentUser) await checkRole();
            loadData();
        }

        async function checkRole() {
            const { data } = await sb.from('profiles').select('is_admin').eq('id', currentUser.id).single();
            isAdmin = data?.is_admin || false;
            renderAuthUI();
        }

        function renderAuthUI() {
            const area = document.getElementById('auth-area');
            const adminBtns = document.getElementById('admin-btns');
            if (!currentUser) {
                area.innerHTML = `<button onclick="login()" class="bg-white text-blue-900 px-3 py-1 rounded font-semibold">Accedi</button>`;
                adminBtns.classList.add('hidden');
            } else {
                area.innerHTML = `<span>Ciao ${currentUser.user_metadata?.nome || 'Atleta'}</span> <button onclick="logout()" class="text-sm underline">Esci</button>`;
                if (isAdmin) {
                    adminBtns.innerHTML = `
                        <button onclick="openModal('uscita')" class="bg-green-500 text-white px-3 py-1 rounded text-sm mr-2">+ Uscita</button>
                        <button onclick="openModal('gara')" class="bg-purple-500 text-white px-3 py-1 rounded text-sm">+ Gara</button>
                    `;
                    adminBtns.classList.remove('hidden');
                } else {
                    adminBtns.classList.add('hidden');
                }
            }
        }

        async function login() {
            const nome = prompt("Il tuo nome (solo la prima volta):");
            const email = prompt("La tua email:");
            const password = prompt("Password (almeno 6 caratteri):");
            if (!email || !password) return;

            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                // Se non esiste, proviamo a registrarlo
                const { error: regError } = await sb.auth.signUp({ 
                    email, password, 
                    options: { data: { nome: nome || 'Utente' } } 
                });
                if (regError) showMsg(regError.message, 'error');
                else showMsg("Registrato! Controlla email per conferma o riprova il login.");
            } else {
                await checkUser();
            }
        }

        async function logout() {
            await sb.auth.signOut();
            isAdmin = false;
            currentUser = null;
            location.reload();
        }

        // --- CARICAMENTO DATI ---
        function switchTab(tab) {
            document.getElementById('tab-uscite').className = tab === 'uscite' ? 'px-4 py-2 font-semibold text-blue-600 border-b-2 border-blue-600' : 'px-4 py-2 font-semibold text-gray-500';
            document.getElementById('tab-gare').className = tab === 'gare' ? 'px-4 py-2 font-semibold text-blue-600 border-b-2 border-blue-600' : 'px-4 py-2 font-semibold text-gray-500';
            loadData(tab);
        }

        async function loadData(tab = 'uscite') {
            const area = document.getElementById('content-area');
            area.innerHTML = '<div class="text-center p-4"><div class="loader"></div> Caricamento...</div>';

            if (tab === 'uscite') {
                const { data } = await sb.from('uscite').select('*').order('data_uscita', { ascending: false });
                area.innerHTML = '<div class="space-y-4" id="list-uscite"></div>';
                if (data && data.length > 0) data.forEach(renderUscita);
                else area.innerHTML = '<p class="text-gray-500">Nessuna uscita programmata.</p>';
            } else {
                const { data } = await sb.from('gare').select('*, iscrizioni(user_id, profiles(nome))').order('data_gara', { ascending: false });
                area.innerHTML = '<div class="space-y-4" id="list-gare"></div>';
                if (data && data.length > 0) data.forEach(renderGara);
                else area.innerHTML = '<p class="text-gray-500">Nessuna gara in programma.</p>';
            }
        }

        // --- RENDERING ---
        function renderUscita(item) {
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-lg shadow border-l-4 border-blue-500";
            div.innerHTML = `
                <h3 class="font-bold text-lg">${item.titolo}</h3>
                <p class="text-sm text-gray-500">📅 ${item.data_uscita} | ${item.descrizione || ''}</p>
                <div id="map-${item.id}" class="map-container"></div>
            `;
            document.getElementById('list-uscite').appendChild(div);
            
            // Mappa GPX
            if (item.gpx_url) {
                setTimeout(() => {
                    const map = L.map(`map-${item.id}`).setView([45.5, 9.2], 10); // Default su Italia
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
                    new L.GPX(item.gpx_url, { async: true }).on('loaded', function(e) {
                        map.fitBounds(e.target.getBounds());
                    }).addTo(map);
                }, 100);
            } else {
                document.getElementById(`map-${item.id}`).innerHTML = '<p class="p-4 text-gray-400">Traccia GPX non disponibile</p>';
            }
        }

        async function renderGara(item) {
            const iscritti = item.iscrizioni || [];
            const isIscritto = currentUser && iscritti.some(i => i.user_id === currentUser.id);
            
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-lg shadow border-l-4 border-purple-500";
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-lg">${item.titolo}</h3>
                        <p class="text-sm text-gray-500">📅 ${item.data_gara} | 📍 ${item.luogo || 'Da definire'}</p>
                    </div>
                    ${currentUser && !isAdmin ? (
                        isIscritto 
                        ? `<button onclick="disiscriviti(${item.id})" class="bg-red-100 text-red-600 px-3 py-1 rounded text-sm">Annulla</button>`
                        : `<button onclick="iscriviti(${item.id})" class="bg-purple-600 text-white px-3 py-1 rounded text-sm">Partecipa</button>`
                    ) : ''}
                </div>
                <div class="mt-4">
                    <h4 class="font-semibold text-sm mb-1">Partecipanti (${iscritti.length}):</h4>
                    <div class="flex flex-wrap gap-2">
                        ${iscritti.length > 0 ? iscritti.map(i => `<span class="bg-gray-100 px-2 py-1 rounded text-sm">${i.profiles?.nome || 'Anonimo'}</span>`).join('') : '<span class="text-sm text-gray-400">Ancora nessun iscritto.</span>'}
                    </div>
                </div>
            `;
            document.getElementById('list-gare').appendChild(div);
        }

        // --- AZIONI UTENTE ---
        async function iscriviti(garaId) {
            const { error } = await sb.from('iscrizioni').insert({ user_id: currentUser.id, gara_id: garaId });
            if (error) showMsg("Errore iscrizione", 'error');
            else { showMsg("Iscritto!"); loadData('gare'); }
        }

        async function disiscriviti(garaId) {
            const { error } = await sb.from('iscrizioni').delete().eq('user_id', currentUser.id).eq('gara_id', garaId);
            if (error) showMsg("Errore", 'error');
            else { showMsg("Iscrizione annullata."); loadData('gare'); }
        }

        // --- ADMIN MODALE & UPLOAD ---
        function openModal(type) {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('modal-title').textContent = type === 'uscita' ? 'Nuova Uscita' : 'Nuova Gara';
            document.getElementById('form-type').value = type;
            document.getElementById('gpx-input-area').className = type === 'uscita' ? '' : 'hidden';
            document.getElementById('f-extra').placeholder = type === 'uscita' ? 'Descrizione percorso' : 'Luogo della gara';
        }

        function closeModal() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-form').reset();
        }

        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('form-type').value;
            const titolo = document.getElementById('f-titolo').value;
            const data = document.getElementById('f-data').value;
            const extra = document.getElementById('f-extra').value;
            const gpxFile = document.getElementById('f-gpx').files[0];

            let gpxUrl = null;

            if (type === 'uscita' && gpxFile) {
                const filePath = `${currentUser.id}-${Date.now()}.gpx`;
                const { error: uploadErr } = await sb.storage.from('tracce-gpx').upload(filePath, gpxFile);
                if (uploadErr) { showMsg("Errore upload GPX", 'error'); return; }
                const { data: urlData } = sb.storage.from('tracce-gpx').getPublicUrl(filePath);
                gpxUrl = urlData.publicUrl;
            }

            if (type === 'uscita') {
                const { error } = await sb.from('uscite').insert({ titolo, data_uscita: data, descrizione: extra, gpx_url: gpxUrl });
                if (error) showMsg("Errore salvataggio", 'error');
                else showMsg("Uscita creata!");
            } else {
                const { error } = await sb.from('gare').insert({ titolo, data_gara: data, luogo: extra });
                if (error) showMsg("Errore salvataggio", 'error');
                else showMsg("Gara creata!");
            }
            
            closeModal();
            loadData(type === 'uscita' ? 'uscite' : 'gare');
        });

        // AVVIO
        checkUser();
    </script>
</body>
</html>
